<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <div>
            <p>Ano de Nascimento:
                <input type="number" name="txtano" id="txtano" min="0">
            </p>
            <p>Sexo:
                <input type="radio" name="radsex" id="masc" value="M" checked>Masculino
                <input type="radio" name="radsex" id="fem" value="F">Feminino
            </p>
            <input type="button" value="Verificar Idade" onclick="verificar()">
        </div>
        <div id="res">
            Preencha os dados acima e clique em Verificar Idade
        </div>
    </section>
    <footer>
        <p>Curso de JavaScript - Aula 12</p>
    </footer>
    <script src="scriptAula12.js"></script>
</body>
</html>
